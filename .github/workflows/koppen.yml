name: Nieuws bijwerken

# GitHub laat een frequente cron bijna altijd vallen. Dit bestand stond op
# elke 10 minuten; in de 16 uur daarna startten er 2 geplande runs.
# Het uurlijkse schema is daarom alleen een vangnet.
#
# Voor een vaste verversing (bijvoorbeeld elke 10 minuten) moet een externe
# taak de workflow wakker maken. Twee manieren, allebei met een token dat
# alleen deze repo mag aansturen (Actions: read and write). Het token hoort
# niet in git.
#
#   POST https://api.github.com/repos/verbeeckorama/nieuws/actions/workflows/koppen.yml/dispatches
#   Authorization: Bearer <token>
#   Accept: application/vnd.github+json
#   X-GitHub-Api-Version: 2022-11-28
#   {"ref":"main"}
#
#   POST https://api.github.com/repos/verbeeckorama/nieuws/dispatches
#   dezelfde headers
#   {"event_type":"ververs"}
#
# Een antwoord 204 betekent dat de run in de wachtrij staat.
# Na 60 dagen zonder commit, issue of pull request zet GitHub geplande
# workflows uit. De externe ping blijft werken zolang deze workflow
# op het tabblad Actions aan staat. Staat ze uit, dan opnieuw aanzetten.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ververs]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Een lopende deploy niet afbreken. upload en deploy horen in aparte jobs:
# in dezelfde job ziet deploy-pages het artifact soms nog niet
# ("No artifacts named github-pages") en faalt de publicatie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Koppen ophalen
        run: |
          mkdir -p site
          cp index.html site/
          python3 fetch_feeds.py site/headlines.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
